name = "srs-billing"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Production. Secrets (never commit them): RESEND_API_KEY, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, PASS_SIGNING_KEY, each set with `npx wrangler secret put NAME`.
# ⚠ From a real terminal: through Claude Code's `!` prompt wrangler can't prompt, and saves an
# EMPTY secret. Or pipe it in: `(Get-Clipboard -Raw).Trim() | npx wrangler secret put NAME`.
[vars]
EMAIL_FROM = "Slippi Ranked Stats <login@mail.slippirankedstats.com>"
# The live-mode $5/month Price (slice 8). Created 2026-10-14 as price_1UQe5uFKmBCOtBry5x6TwzDo
# ("Include tax in price: No"); check that tax choice before using it.
STRIPE_PRICE_ID = "price_REPLACE_WITH_LIVE_PRICE"

[[d1_databases]]
binding = "DB"
database_name = "srs-billing"
# Replace with the id printed by `npx wrangler d1 create srs-billing`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Staging: what the dev build talks to. Deploy with `npm run deploy:staging`.
# Until Resend is set up it has no RESEND_API_KEY, so sign-in codes go to the worker's log
# instead of an inbox (read them with `npx wrangler tail --env staging`). Production never sets
# ALLOW_LOGGED_CODES, so a missing key there is an error rather than a silent log.
[env.staging]
name = "srs-billing-staging"

[env.staging.vars]
EMAIL_FROM = "Slippi Ranked Stats <login@mail.slippirankedstats.com>"
ALLOW_LOGGED_CODES = "1"
# The test-mode $5/month Price.
STRIPE_PRICE_ID = "price_1UQeJ3FKmBCOtBrybTSdtSvc"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "srs-billing-staging"
database_id = "1bbb1d40-ecce-4387-ad59-316c19c5e404"
migrations_dir = "migrations"
