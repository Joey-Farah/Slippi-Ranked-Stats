[package]
name = "slippi-ranked-stats"
version = "1.11.0"
description = "Slippi Ranked Stats Dashboard"
authors = []
edition = "2021"

[lib]
name = "slippi_ranked_stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "slippi-ranked-stats"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-shell = { version = "2" }
tauri-plugin-http = { version = "2" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-process = { version = "2" }
tauri-plugin-deep-link = { version = "2" }
tokio = { version = "1", features = ["net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading Slippi Dolphin's emulated GameCube RAM for the OBS input viewer (see src/dolphin.rs).
# Windows-only by design: macOS needs task_for_pid, which requires entitlements or root, and Mac
# is ~1% of installs — those users simply don't get the toggle.
[target.'cfg(windows)'.dependencies]
# Box-controller input over USB serial (see src/boxx.rs). default-features = false drops the
# libudev feature, which is Linux-only and would otherwise demand libudev-dev on that platform
# for a feature that is Windows-only anyway.
serialport = { version = "4", default-features = false }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Threading",
  "Win32_System_Memory",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
